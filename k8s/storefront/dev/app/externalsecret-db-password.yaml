apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pydjan-app-db-password
  namespace: storefront-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: storefront-dev/storefront-dev/DB_PASSWORD
